plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.ravi.freespinner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ravi.freespinner'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        pip {
            // Keep the base APK dependency-free. Add pure-Python packages here
            // if a bundled runner needs them.
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
}
